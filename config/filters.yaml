# Starter filters. The dashboard's Filters page is the main editor; this file seeds the
# database the first time (scripts/sync_config.py) and is what Git snapshots track.
#
# kind: hard → job is dropped (kept in DB, hidden, counted)
#       soft → score adjusted by `weight` (e.g. +8 or -10)
# field: title | description | text (title+description) | company | country | region |
#        remote | contract | seniority | language | salary_min | source | intern_eligibility
# intern_eligibility is set on internships only (graduate_ok | graduate_ok_conditions | student_only |
#   unknown, see config/internship_rules.yaml); other jobs have none, so they pass these rules untouched.
# Filters added here after your database was seeded reach it through jh/config.py CONFIG_SYNCS.
# operator: contains | not_contains | equals | not_equals | in | not_in | gte | lte

filters:
  - name: Languages I can apply in
    kind: hard
    field: language
    operator: in
    value: [en, fr, ar]

  - name: Drop senior roles
    kind: hard
    field: seniority
    operator: not_in
    value: [senior]

  - name: Drop unpaid
    kind: hard
    field: text
    operator: not_contains
    value: [unpaid, "non rémunéré", "non-rémunéré", bénévole, volunteer position]

  - name: Prefer remote
    kind: soft
    field: remote
    operator: equals
    value: remote
    weight: 5

  - name: Boost Tunisia
    kind: soft
    field: region
    operator: equals
    value: tunisia
    weight: 5

  - name: Boost protein / bio terms
    kind: soft
    field: text
    operator: contains
    value: [protein, alphafold, esm]
    weight: 6

  # internships: the candidate has graduated, so only internships open to graduates are useful
  - name: "Internships: drop student-only"
    kind: hard
    field: intern_eligibility
    operator: not_equals
    value: student_only

  - name: Internships open to graduates
    kind: soft
    field: intern_eligibility
    operator: equals
    value: graduate_ok
    weight: 5

  - name: Internships with unclear eligibility
    kind: soft
    field: intern_eligibility
    operator: equals
    value: unknown
    weight: -5
