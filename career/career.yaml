experiences:

  - id: euranova
    status: confirmed
    title: {en: AI Research Intern (Graduation Project), fr: Stagiaire Recherche en IA (Projet de fin d'études)}
    company: Euranova
    team: Explore pillar — independent research centre
    location: Tunis, Tunisia
    start: 2026-02          # QUESTION: report says "five-month internship"; CVs say 02/2026 – 09/2026
    end: 2026-09
    context:
      en: >-
        Five-month graduation research project in Euranova's research centre. Compute on MareNostrum 5 (Barcelona
        Supercomputing Center, NVIDIA H100, EuroHPC allocation ehpc795); interdisciplinary supervision with a
        biology consultant. Framed as Design Science Research.
      fr: >-
        Projet de fin d'études de cinq mois au centre de recherche d'Euranova. Calcul sur MareNostrum 5 (Barcelona
        Supercomputing Center, NVIDIA H100, allocation EuroHPC) ; encadrement interdisciplinaire avec un consultant
        en biologie.
    report: "Optimisation of Protein Language Models for Cryptic Binding Site Prediction (≈60 pages)"
    profiles: [protein_ml, research_hpc, general_ml]
    bullets:
      # ---- headline / framing ----
      - id: eur_finetune
        status: confirmed
        default: true
        en: >-
          Fine-tuned ESM2-15B, a large language model trained on protein sequences, to predict where drug
          molecules can attach to proteins, helping identify new drug targets.
        fr: >-
          Fine-tuning d'ESM2-15B, un grand modèle de langage entraîné sur des séquences protéiques, pour prédire
          les sites où des molécules médicamenteuses peuvent se fixer sur les protéines, afin d'aider à identifier
          de nouvelles cibles thérapeutiques.
        skills: [esm2, protein_lm, fine_tuning, lora, pytorch, huggingface, binding_sites]
      - id: eur_finetune_technical
        status: confirmed
        en: >-
          Built a sequence-only predictor of cryptic protein–ligand binding sites (pockets hidden in a protein's
          resting structure, missed by structure-based methods) on top of ESM2-15B, the largest protein language
          model (15B parameters).
        fr: >-
          Développement d'un prédicteur de sites de liaison cryptiques protéine–ligand (poches invisibles dans la
          structure au repos, manquées par les méthodes structurales) à partir de la seule séquence, sur la base
          d'ESM2-15B (15 milliards de paramètres).
        skills: [esm2, protein_lm, binding_sites, protein_structure]
      # ---- results ----
      - id: eur_sota
        status: confirmed
        default: true
        metrics: {auprc_from: 0.36, auprc_to: 0.488, relative: "+35%", mcc_from: 0.39, mcc_to: 0.47}
        en: >-
          Raised the sequence-only state of the art on the CryptoBench benchmark from 0.36 to 0.488 AUPRC (+35%),
          a ceiling confirmed by two independent architectures converging on the same score.
        fr: >-
          Amélioration de l'état de l'art (méthodes basées sur la séquence) sur le benchmark CryptoBench : AUPRC de
          0,36 à 0,488 (+35 %), plafond confirmé par deux architectures indépendantes atteignant le même score.
        skills: [evaluation, benchmarking, pytorch]
      - id: eur_zero_shot
        status: confirmed
        metrics: {zero_shot_auprc: 0.435, gain_vs_sota: "+21%"}
        en: >-
          Designed a staged transfer strategy (general binding on 50,000 BioLiP proteins, then cryptic sites):
          the model beat the published baseline zero-shot, before seeing any cryptic training example
          (AUPRC 0.435 vs 0.36).
        fr: >-
          Conception d'une stratégie de transfert en deux temps (liaison générale sur 50 000 protéines BioLiP, puis
          sites cryptiques) : le modèle dépasse la référence publiée sans aucun exemple cryptique (AUPRC 0,435 contre
          0,36).
        skills: [transfer_learning, experimental_design, binding_sites]
      - id: eur_adapter_placement
        status: confirmed
        default: true
        metrics: {coach420_auprc_attention_only: 0.446, coach420_auprc_ffn: 0.550}
        en: >-
          Showed that extending LoRA adapters to feed-forward layers prevents catastrophic forgetting: attention-only
          adapters lost general binding ability on external benchmarks (COACH420 AUPRC 0.51→0.45), while the
          feed-forward variant improved it (0.51→0.55).
        fr: >-
          Démonstration que l'extension des adaptateurs LoRA aux couches feed-forward évite l'oubli catastrophique :
          l'adaptation limitée à l'attention dégrade la détection générale sur benchmarks externes (COACH420 AUPRC
          0,51→0,45), la variante feed-forward l'améliore (0,51→0,55).
        skills: [lora, transfer_learning, evaluation, benchmarking]
      # ---- engineering ----
      - id: eur_pipeline
        status: confirmed
        default: true
        en: >-
          Built a four-stage training pipeline in PyTorch, Hugging Face Transformers and PEFT, with Optuna
          hyperparameter searches (50 trials per variant, pruning) and 5-fold cross-validation, run on NVIDIA H100
          GPUs via SLURM.
        fr: >-
          Développement d'un pipeline d'entraînement en quatre étapes (PyTorch, Hugging Face Transformers, PEFT) avec
          recherche d'hyperparamètres Optuna (50 essais par variante, élagage) et validation croisée à 5 plis, exécuté
          sur GPU NVIDIA H100 via SLURM.
        skills: [pytorch, huggingface, lora, optuna, hyperparameter_tuning, cross_validation, slurm, hpc, multi_gpu]
      - id: eur_memory
        status: confirmed
        en: >-
          Fit training of a 15B-parameter model on a single 64 GB H100 without quantisation, using a frozen bfloat16
          backbone, LoRA (≈0.1% of parameters trainable), gradient checkpointing and scaled dot-product attention.
        fr: >-
          Entraînement d'un modèle de 15 milliards de paramètres sur un seul H100 de 64 Go sans quantification :
          backbone gelé en bfloat16, LoRA (≈0,1 % des paramètres entraînables), gradient checkpointing, attention SDPA.
        skills: [lora, mixed_precision, gpu_memory_optimisation, pytorch]
      - id: eur_hpc_pipeline
        status: confirmed
        en: >-
          Ran all training and evaluation on the MareNostrum 5 supercomputer (EuroHPC allocation): SLURM job
          submission and monitoring, wall-time and GPU-hour budgeting on a shared allocation.
        fr: >-
          Exécution de l'ensemble des entraînements sur le supercalculateur MareNostrum 5 (allocation EuroHPC) :
          soumission et suivi de jobs SLURM, gestion du temps de calcul et des heures GPU d'une allocation partagée.
        skills: [slurm, hpc, multi_gpu, linux, bash]
      # ---- rigour ----
      - id: eur_leakage
        status: confirmed
        default: true
        en: >-
          Removed residue-level and homology data leakage by clustering proteins with MMseqs2 at 30% sequence
          identity and splitting at cluster level; handled severe class imbalance (<5% positives) with weighted
          loss and AUPRC-based model selection.
        fr: >-
          Suppression des fuites de données (au niveau des résidus et par homologie) par clustering MMseqs2 à 30 %
          d'identité et découpage par cluster ; gestion d'un fort déséquilibre de classes (<5 % de positifs) par une
          perte pondérée et une sélection de modèle sur l'AUPRC.
        skills: [mmseqs2, data_leakage, class_imbalance, evaluation, experimental_design]
      - id: eur_threshold_fix
        status: confirmed
        en: >-
          Diagnosed why half of the hyperparameter trials collapsed to zero MCC (decision threshold tuned as a
          hyperparameter) and redesigned the search around a threshold-free objective with a post-hoc operating
          point.
        fr: >-
          Diagnostic de l'effondrement de la moitié des essais d'optimisation (seuil de décision traité comme un
          hyperparamètre) et refonte de la recherche autour d'un objectif indépendant du seuil.
        skills: [hyperparameter_tuning, evaluation, debugging]
      - id: eur_baseline_audit
        status: confirmed
        en: >-
          Audited the published baseline's source code and found its decision threshold was calibrated on a
          different model than the one reported; anchored all comparisons on threshold-free metrics (AUPRC, AUROC).
        fr: >-
          Audit du code source de la méthode de référence : son seuil de décision était calibré sur un autre modèle
          que celui publié ; comparaisons ancrées sur des métriques indépendantes du seuil (AUPRC, AUROC).
        skills: [research_reproduction, code_review, evaluation]
      # ---- interpretability ----
      - id: eur_sae
        status: confirmed
        default: true
        metrics: {features: 50, auprc_recovered: "81%", dictionary_size: 163840}
        en: >-
          Interpretability: trained sparse autoencoders (163,840 features) on frozen vs fine-tuned ESM2-15B
          activations; 50 features recover 81% of the model's AUPRC, and fine-tuning shifts features from
          amino-acid identity toward binding context.
        fr: >-
          Interprétabilité mécaniste : autoencodeurs parcimonieux (163 840 features) sur les activations d'ESM2-15B
          gelé et fine-tuné ; 50 features retrouvent 81 % de l'AUPRC du modèle, et le fine-tuning déplace les features
          de l'identité de l'acide aminé vers le contexte de liaison.
        skills: [interpretability, sparse_autoencoders, probing, esm2, pytorch]
      - id: eur_ablation
        status: confirmed
        en: >-
          Ran feature ablations showing ligand-class features compete inside the model: removing the top cofactor
          features lowered cofactor AUPRC by 0.04 and raised nucleotide AUPRC by 0.06.
        fr: >-
          Ablations de features montrant une compétition entre classes de ligands : retirer les principales features
          « cofacteur » réduit leur AUPRC de 0,04 et augmente celle des nucléotides de 0,06.
        skills: [interpretability, ablation_studies]
      - id: eur_family_control
        status: confirmed
        en: >-
          Showed that crypticity probes evaluated without protein-family control are inflated by ≈0.20 AUROC
          (0.87 vs 0.67), a methodological caution for the field.
        fr: >-
          Mise en évidence d'une surestimation d'environ 0,20 AUROC (0,87 contre 0,67) des sondes de crypticité
          évaluées sans contrôle par famille de protéines : un avertissement méthodologique pour le domaine.
        skills: [probing, data_leakage, evaluation, research_reproduction]
      # ---- communication ----
      - id: eur_comm
        status: confirmed
        en: >-
          Delivered a documented, reproducible pipeline, a ~60-page technical report in LaTeX and a presentation
          to Euranova and an academic jury.
        fr: >-
          Livraison d'un pipeline documenté et reproductible, d'un rapport technique d'environ 60 pages en LaTeX et
          d'une présentation devant Euranova et un jury académique.
        skills: [scientific_writing, latex, presentation, reproducibility]

