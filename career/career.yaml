# Career database — DRAFT v0.1 (2026-10-23)
# Built from: 6 CV versions (EN/FR, AI engineer, ICSM/HPC), the Euranova graduation report, the Orion.IA report,
# the internship agreement, the INSAT study plan (MPI→RT5),
# and what Elyes has described in past conversations (Euranova project, RAG and Kibale projects, TIMUN).
#
# Conventions
#   id         stable identifier, used by the editor and per-job CVs
#   status     confirmed  = appears on a CV you wrote or in your reports
#              to_confirm = drafted from conversations or inferred — check it
#   text.en / text.fr      bullet text in each language (missing fr = to be translated)
#   skills     skill ids this entry demonstrates (links to the skills section)
#   profiles   which search profiles it is most relevant to
#              protein_ml · climate_ai · general_ml · genai_cv · research_hpc · mission_driven
#   default    true = on in the base CV; the editor can toggle any entry per job
#   level      skills only, 1–5, used for matching, never printed. null = you fill it in.

# ---------------------------------------------------------------------------------------------
headlines:            # title under your name — chosen per job
  - id: ml_engineer
    en: AI / Machine Learning Engineer
    fr: Ingénieur IA / Machine Learning
    profiles: [general_ml, genai_cv, protein_ml, climate_ai]
  - id: hpc_molecular
    en: AI Engineer — High-Performance Computing & Molecular Modelling
    fr: Ingénieur IA — Calcul scientifique haute performance & modélisation moléculaire
    profiles: [research_hpc, protein_ml]

summaries:
  - id: sum_general
    profiles: [general_ml, genai_cv]
    default: true
    en: >-
      AI / Machine Learning Engineer with a background in deep learning, generative AI and computer vision.
      Experienced in fine-tuning large pretrained models, building RAG systems, designing training and
      evaluation pipelines in PyTorch, and running experiments on GPU clusters. Focused on rigorous evaluation
      and results that hold up against independent evidence.
    fr: >-
      Ingénieur IA / Machine Learning spécialisé en deep learning, IA générative et vision par ordinateur.
      Expérience en fine-tuning de grands modèles pré-entraînés, conception de systèmes RAG, développement de
      pipelines d'entraînement et d'évaluation en PyTorch et expérimentation sur clusters GPU. Attaché à une
      évaluation rigoureuse et à des résultats confirmés par des sources indépendantes.
  - id: sum_hpc_research
    profiles: [research_hpc, protein_ml]
    fr: >-
      Ingénieur (Bac+5) en Réseaux & Télécommunications, spécialisé en intelligence artificielle, avec une
      expérience de recherche à l'interface entre le calcul et les sciences du vivant : prédiction de sites de
      liaison protéine–ligand à l'échelle du résidu sur le supercalculateur MareNostrum 5 (allocation EuroHPC).
      Habitué aux simulations longues sur centres HPC, à l'analyse de grands volumes de données en Python et à la
      confrontation rigoureuse des résultats avec la littérature.
    en: >-
      Engineer (5-year degree) in Networks & Telecommunications specialised in AI, with research experience at the
      interface of computing and life sciences: residue-level protein–ligand binding site prediction on the
      MareNostrum 5 supercomputer (EuroHPC allocation). Used to long-running jobs on HPC centres, large-scale data
      analysis in Python and checking results rigorously against the literature.

