name: Snapshot database to Git

on:
  schedule:
    - cron: "43 2 * * *"          # daily, 03:43 Tunis time
  workflow_dispatch:

permissions:
  contents: write                 # needed to commit snapshots

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Export Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/snapshot.py
      - name: Commit if anything changed
        run: |
          git config user.name  "jobhunter-bot"
          git config user.email "jobhunter-bot@users.noreply.github.com"
          git add snapshots/
          if git diff --cached --quiet; then
            echo "No changes since last snapshot."
          else
            git commit -m "snapshot $(date -u +%Y-%m-%d): $(git diff --cached --shortstat)"
            git push
          fi
